<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Display</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fdf7d6;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Container */
.container {
  width: 400px;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* Textarea */
textarea {
  width: 100%;
  height: 150px;
  padding: 10px;
  font-size: 16px;
  resize: none;
}

/* Button */
button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
  <h3>Message Display</h3>

  <textarea id="textArea" readonly></textarea>

  <button onclick="showMessage()">Show Message</button>
</div>

<script>
function showMessage() {
  const message = "

get filterPanel(): Locator {
  return this.page
    .locator(
      '[class*="filter-panel"], [class*="filter-drawer"], ' +
      '[class*="filter-container"], [class*="filter-sidebar"], ' +
      'mat-sidenav, mat-drawer, [class*="side-panel"]'
    )
    .last();
}

When('the user opens the Filter panel and selects multiple options within the same category',
  async ({ page, initiativesPage }) => {
    await initiativesPage.filterButton.click();
    await page.waitForTimeout(400);

    // Wait for filter panel to appear - use the Clear All link as anchor
    await page.locator('button, a, span').filter({ hasText: /clear all/i })
      .waitFor({ state: 'visible', timeout: 10000 });

    // Find LOB section (first expanded section) and get its checkboxes directly
    const lobSection = page.locator('mat-expansion-panel').filter({ hasText: /LOB/i }).first();
    await lobSection.waitFor({ state: 'visible', timeout: 5000 });

    const checkboxes = lobSection.locator('mat-checkbox');
    const count = await checkboxes.count();

    if (count >= 2) {
      await checkboxes.nth(0).click();
      await page.waitForTimeout(200);
      await checkboxes.nth(1).click();
      await page.waitForTimeout(200);
    } else if (count === 1) {
      await checkboxes.nth(0).click();
      await page.waitForTimeout(200);
    }

    // Do NOT click Show Results here — Then step verifies counter first
  }
);

get filterResultCounter(): Locator {
  return this.page
    .locator('button, a')
    .filter({ hasText: /show \d+ result/i })
    .first();
}

Then('the system applies an inclusive OR condition to the results',
  async ({ initiativesPage, page }) => {
    // Verify counter visible (panel still open)
    await expect(initiativesPage.filterResultCounter).toBeVisible({ timeout: 10000 });
    // Apply the filter
    await page.getByRole('button', { name: /show.*results/i }).click();
    await page.waitForTimeout(400);
  }
);


  

 
    ";

  document.getElementById("textArea").value = message;
}
</script>

</body>
</html>
